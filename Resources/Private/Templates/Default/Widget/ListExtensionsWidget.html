<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Widget/ListExtensionsWidget" />

<f:section name="main">
    <div class="widget-table-wrapper">
        <table class="widget-table table table-striped table-hover">
            <f:for each="{items}" as="item">
                <tr>
                    <td class="d-flex">
                        <div class="justify-content-start flex-row position-relative w-100">
                            <div class="fw-bold extension-title">
                                <f:link.external class="stretched-link" uri="{item.link}" target="_blank">{item.title -> f:format.crop(maxCharacters: 180)}</f:link.external>
                            </div>
                            <div class="">
                                {item.extensionKey}
                                <span class="mx-1">&#8226;</span>
                                v{item.version}
                            </div>
                        </div>
                        <div class="ms-auto text-nowrap">
                            <time datetime="{item.lastUpdated -> f:format.date(format: '%Y-%m-%d')}">{item.lastUpdated -> f:format.date(format: '%d-%b-%Y')}</time>
                        </div>
                    </td>
                </tr>
            </f:for>
        </table>
    </div>
</f:section>

<f:section name="footer">
    <f:link.typolink parameter="{footerLink}" target="_blank" class="d-flex justify-content-center">
        <f:translate domain="t3extensions_widget" id="widgets.footerLinkText" />
        <span class="ms-1"><core:icon identifier="actions-window-open" size="small" /></span>
    </f:link.typolink>
</f:section>

</html>
